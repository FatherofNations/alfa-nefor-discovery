# Проверки на каждый push/PR в main: линт, типы, file:// и сборка Next.
# Деплой здесь НЕ выполняется — прод выкатывается по явной команде
# (см. alfa://knowledge/deploy-vercel).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build offline archive
        run: npm run build:static

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify the unpacked archive over file://
        run: npm run verify:static

      - name: Upload offline archive
        uses: actions/upload-artifact@v4
        with:
          name: alfa-discovery-offline
          path: static-dist.zip
          if-no-files-found: error

      - name: Build Next
        run: npm run build
